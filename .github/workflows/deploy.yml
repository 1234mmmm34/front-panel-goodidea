name: Deploy Next.js a SmarterASP.NET

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit

      - name: Compilar Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build --webpack

      - name: Quitar devDependencies
        run: npm prune --omit=dev

      - name: Armar carpeta de deploy
        run: |
          mkdir deploy
          cp -r .next public node_modules package.json next.config.mjs server.js web.config deploy/
          rm -rf deploy/.next/cache deploy/.next/types deploy/.next/trace deploy/.next/trace-build

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /site1/
          dangerous-clean-slate: false
